# Installer configuration (electron-builder). See docs/RELEASING.md.
# Run `npm run dist` after building the layer; `npm run pack` produces an unpacked directory
# in release/ for a quick check of the packaged layout.
appId: com.brendanduncan.gpu-inspector
productName: GPU Inspector
copyright: Copyright © 2025 Brendan Duncan

directories:
  output: release
  # Not the CMake build directory at the repository root. app/installer holds installer.nsh, which
  # registers the capture layer as an implicit layer on Windows.
  buildResources: installer

# English only, which drops 54 of Electron's 55 Chromium locale bundles: 48MB of the installed
# tree and 8MB of every download, for translations of Chromium's own strings (the text-field
# context menu, network error pages) that the app has no counterpart for -- its UI is English.
# Spelled en-US and not en: app-builder-lib matches this against the locale file's own name, and
# its prefix fallback is the wrong way round (wanted.startsWith(`${language}-`)), so en matches
# nothing and would delete en-US.pak along with the rest, leaving Chromium no strings at all.
# macOS keeps en.lproj through that same fallback, so the one value covers all three platforms.
electronLanguages: [en-US]

asar: true
files:
  - dist/**/*
  - "!dist/**/*.map"
  - "!dist/layer/**"
  - "!dist/plugins/**"
  - package.json

# The app looks for the layer in resources/layer and its icons in resources/assets
# (findLayerDir and appIconPath in src/main/main.ts). On macOS dist/layer holds only the Android
# layer, when it was built: there is no desktop capture layer for Apple (tools/stage_layer.mjs).
extraResources:
  - from: dist/layer
    to: layer
  # Plugins built in this checkout (tools/stage_layer.mjs; docs/PLUGINS.md), found in resources/plugins.
  - from: dist/plugins
    to: plugins
  - from: assets
    to: assets
    filter:
      - icon.ico
      - icon.png
  # The header an application includes to ask for a capture itself (docs/CAPTURE.md).
  - from: ../../include
    to: include
  - from: ../../LICENSE
    to: LICENSE
  - from: ../../THIRD_PARTY_LICENSES.md
    to: THIRD_PARTY_LICENSES.md

win:
  target:
    - nsis
  icon: assets/icon.ico
  artifactName: GPU-Inspector-Setup-${version}.${ext}

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  deleteAppDataOnUninstall: false
  license: ../../LICENSE

linux:
  target:
    - deb
    # AppImage beside it: one file that runs on any distribution, which is what a Fedora or Arch
    # user has instead of a package, and the only Linux format electron-updater can install an
    # update into by itself (a .deb it can only tell you about).
    - AppImage
  icon: assets/icon.png
  executableName: gpu-inspector
  # The .desktop file is gpu-inspector.desktop with StartupWMClass=gpu-inspector, matching the
  # desktopName in package.json that Electron uses as the window's WM_CLASS.
  syncDesktopName: true
  category: Development
  synopsis: Graphics inspector for native Vulkan applications
  desktop:
    entry:
      Keywords: Vulkan;GPU;Graphics;Debugger;Profiler;

deb:
  artifactName: gpu-inspector_${version}_amd64.${ext}
  # Registers the capture layer for the machine as installer.nsh does on Windows, and removes it
  # again on uninstall. Registered is not enabled: the manifest's enable_environment means the
  # loader passes the layer over in every process without VKINSP_ENABLE=1 set.
  afterInstall: installer/deb-postinst.sh
  afterRemove: installer/deb-postrm.sh
  # electron-builder's defaults for an Electron app, plus the Vulkan loader.
  depends:
    - libgtk-3-0
    - libnotify4
    - libnss3
    - libxss1
    - libxtst6
    - xdg-utils
    - libatspi2.0-0
    - libuuid1
    - libsecret-1-0
    - libvulkan1

appImage:
  artifactName: GPU-Inspector-${version}-x86_64.${ext}

# macOS is the UI only: there is no Apple capture layer, so a mac build inspects Android targets
# and opens .gpucap files (see the macOS section of README.md).
mac:
  target:
    # Both architectures, as separate artifacts rather than one universal binary: half the
    # download, and electron-updater picks the right one from latest-mac.yml. The .zip is not
    # only a second download format — it is the archive electron-updater installs from, so
    # dropping it would leave installed builds unable to update themselves.
    - target: dmg
      arch: [arm64, x64]
    - target: zip
      arch: [arm64, x64]
  icon: assets/icon.icns
  category: public.app-category.developer-tools
  darkModeSupport: true
  artifactName: GPU-Inspector-${version}-${arch}.${ext}
  # Signed with the project's Developer ID and notarized, which is what lets a downloaded build
  # open without the user being told it is damaged or unidentified. `identity` is deliberately
  # unset so electron-builder discovers the certificate: from the keychain on a developer's Mac,
  # from CSC_LINK/CSC_KEY_PASSWORD in CI. Notarization runs when APPLE_ID,
  # APPLE_APP_SPECIFIC_PASSWORD and APPLE_TEAM_ID are in the environment, and staples the ticket
  # to the bundle before the .dmg and .zip are built from it, so both carry it.
  # docs/RELEASING.md has the credential setup.
  #
  # Neither step is required to get a working build: without a certificate electron-builder logs
  # that it skipped signing, without the Apple credentials it logs that it skipped notarization,
  # and tools/adhoc_sign.cjs leaves the bundle ad-hoc signed. A contributor with no Apple
  # Developer account can still build and run the app.
  hardenedRuntime: true

# Two things, in this order: it removes the parts of Electron the app never loads, then ad-hoc
# signs the macOS bundle. It runs before electron-builder's own signing, which is what lets the
# signature seal the pruned tree, and what lets a real Developer ID signature simply replace the
# ad-hoc one -- that half matters only when there is no certificate to sign with.
afterPack: tools/after_pack.cjs

dmg:
  artifactName: GPU-Inspector-${version}-${arch}.${ext}

publish:
  provider: github
  owner: brendan-duncan
  repo: gpu_inspector
  releaseType: release
