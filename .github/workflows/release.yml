name: Release

# Builds the Windows installer and the Linux .deb and publishes them, with the auto-update
# manifests, to a GitHub release for the tag. The release is only created once both builds have
# succeeded, so a failed build never leaves a half-published release. See docs/RELEASING.md.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # 2022 pins the runner that ships the "Visual Studio 17 2022" generator used below.
          - os: windows-2022
            target: win
          # 22.04 rather than latest: the layer's .so links against the runner's glibc, so an
          # older runner keeps the .deb installable on older distributions.
          - os: ubuntu-22.04
            target: linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      # The tag must match app/package.json (a tag v1.2.3 releases version 1.2.3); checked first so a
      # mismatch fails in seconds rather than after the layer build.
      - name: Check that the tag matches package.json
        if: github.ref_type == 'tag'
        working-directory: app
        shell: bash
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION=$(node -p "require('./package.json').version")
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match app/package.json version ${PKG_VERSION}."
            cat <<MSG

          Tag ${GITHUB_REF_NAME} does not match app/package.json, which says ${PKG_VERSION}.
          The tag and package.json must agree. To release ${TAG_VERSION}:

            git push --delete origin ${GITHUB_REF_NAME} && git tag -d ${GITHUB_REF_NAME}
            (cd app && npm version ${TAG_VERSION} --no-git-tag-version)
            git commit -am "v${TAG_VERSION}"
            git tag ${GITHUB_REF_NAME} && git push origin main ${GITHUB_REF_NAME}

          Or, to release what package.json says, tag v${PKG_VERSION} instead.
          MSG
            exit 1
          fi
          echo "Releasing ${PKG_VERSION}"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: app/package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libxcb1-dev libx11-dev libwayland-dev

      # The layer: tests are off so the build needs neither the Vulkan SDK nor glslc.
      - name: Configure layer (Windows)
        if: runner.os == 'Windows'
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64 -DVKINSP_BUILD_TESTS=OFF
      - name: Configure layer (Linux)
        if: runner.os == 'Linux'
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DVKINSP_BUILD_TESTS=OFF
      - name: Build layer
        run: cmake --build build --config Release --parallel

      - name: Install app dependencies
        working-directory: app
        run: npm ci

      - name: Type check
        working-directory: app
        run: npm run typecheck

      # Builds only; the release job below publishes once every platform has built.
      - name: Build installer
        working-directory: app
        run: npm run dist:${{ matrix.target }} -- --publish never

      - uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.target }}
          if-no-files-found: error
          path: |
            app/release/*.exe
            app/release/*.deb
            app/release/*.yml
            app/release/*.blockmap
            !app/release/builder-*.yml

  release:
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          BASE="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}"
          ls -l assets
          cat > notes.md <<NOTES
          # GPU Inspector ${VERSION}

          ## Downloads

          - **Windows**: [GPU-Inspector-Setup-${VERSION}.exe](${BASE}/GPU-Inspector-Setup-${VERSION}.exe)
          - **Linux (Debian/Ubuntu)**: [gpu-inspector_${VERSION}_amd64.deb](${BASE}/gpu-inspector_${VERSION}_amd64.deb)

          Installed builds update themselves: the app checks this repository's releases on startup.
          NOTES
          # latest.yml / latest-linux.yml and the .blockmap are what installed builds read to update.
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --latest \
            --title "GPU Inspector ${VERSION}" --notes-file notes.md assets/*
