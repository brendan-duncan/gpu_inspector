name: Release

# Builds the Windows installer, the Linux .deb and the macOS .dmg/.zip and publishes them, with
# the auto-update manifests, to a GitHub release for the tag. The release is only created once
# every build has succeeded, so a failed build never leaves a half-published release. See
# docs/RELEASING.md.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # 2022 pins the runner that ships the "Visual Studio 17 2022" generator used below.
          - os: windows-2022
            target: win
          # 22.04 rather than latest: the layer's .so links against the runner's glibc, so an
          # older runner keeps the .deb installable on older distributions.
          - os: ubuntu-22.04
            target: linux
          # The UI only: there is no capture layer for Apple, so this job skips the CMake build
          # below and produces both architectures from the one (arm64) runner.
          - os: macos-14
            target: mac
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      # The tag must match app/package.json (a tag v1.2.3 releases version 1.2.3); checked first so a
      # mismatch fails in seconds rather than after the layer build.
      - name: Check that the tag matches package.json
        if: github.ref_type == 'tag'
        working-directory: app
        shell: bash
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION=$(node -p "require('./package.json').version")
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match app/package.json version ${PKG_VERSION}."
            cat <<MSG

          Tag ${GITHUB_REF_NAME} does not match app/package.json, which says ${PKG_VERSION}.
          The tag and package.json must agree. To release ${TAG_VERSION}:

            git push --delete origin ${GITHUB_REF_NAME} && git tag -d ${GITHUB_REF_NAME}
            (cd app && npm version ${TAG_VERSION} --no-git-tag-version)
            git commit -am "v${TAG_VERSION}"
            git tag ${GITHUB_REF_NAME} && git push origin main ${GITHUB_REF_NAME}

          Or, to release what package.json says, tag v${PKG_VERSION} instead.
          MSG
            exit 1
          fi
          echo "Releasing ${PKG_VERSION}"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: app/package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libxcb1-dev libx11-dev libwayland-dev

      # The layer: tests are off so the build needs neither the Vulkan SDK nor glslc. There is no
      # Apple build of it, so the macOS job skips all three of these steps and packages the UI
      # alone (tools/stage_layer.mjs expects that).
      - name: Configure layer (Windows)
        if: runner.os == 'Windows'
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64 -DVKINSP_BUILD_TESTS=OFF
      - name: Configure layer (Linux)
        if: runner.os == 'Linux'
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DVKINSP_BUILD_TESTS=OFF
      - name: Build layer
        if: runner.os != 'macOS'
        run: cmake --build build --config Release --parallel

      - name: Install app dependencies
        working-directory: app
        run: npm ci

      - name: Type check
        working-directory: app
        run: npm run typecheck

      # Builds only; the release job below publishes once every platform has built.
      - name: Build installer
        if: runner.os != 'macOS'
        working-directory: app
        run: npm run dist:${{ matrix.target }} -- --publish never

      # macOS is its own step because CSC_LINK and CSC_KEY_PASSWORD are what electron-builder
      # reads for Windows signing too, and the Mac certificate must not reach that job. Five
      # secrets (docs/RELEASING.md): MAC_CERTS is the Developer ID Application certificate and key
      # as a base64 .p12, MAC_CERTS_PASSWORD its password, and APPLE_ID /
      # APPLE_APP_SPECIFIC_PASSWORD / APPLE_TEAM_ID the notarization credentials.
      #
      # The certificate goes through MAC_CERTS and is exported to CSC_LINK by hand rather than
      # being bound to it directly, because a secret that is not set expands to the empty string,
      # and electron-builder reads an empty CSC_LINK as "a certificate file at the empty path"
      # rather than as "no certificate" (getCscLink in platformPackager.js keeps it: "allow to
      # specify as empty string"). It resolves that against the working directory and dies with
      # `<app dir> not a file`. Exporting it only when it is non-empty is what actually lets a
      # build without the secrets fall back to unsigned. The APPLE_* three need no such care:
      # empty values are falsy where they are read, and notarization logs that it skipped.
      - name: Build installer (macOS, signed and notarized)
        if: runner.os == 'macOS'
        working-directory: app
        env:
          MAC_CERTS: ${{ secrets.MAC_CERTS }}
          MAC_CERTS_PASSWORD: ${{ secrets.MAC_CERTS_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -n "$MAC_CERTS" ]; then
            export CSC_LINK="$MAC_CERTS"
            export CSC_KEY_PASSWORD="$MAC_CERTS_PASSWORD"
          else
            echo "::warning::MAC_CERTS is not set: building unsigned and un-notarized. See docs/RELEASING.md."
            export CSC_IDENTITY_AUTO_DISCOVERY=false
          fi
          npm run dist:mac -- --publish never

      - uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.target }}
          if-no-files-found: error
          path: |
            app/release/*.exe
            app/release/*.deb
            app/release/*.dmg
            app/release/*.zip
            app/release/*.yml
            app/release/*.blockmap
            !app/release/builder-*.yml

  release:
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          BASE="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}"
          ls -l assets
          cat > notes.md <<NOTES
          # GPU Inspector ${VERSION}

          ## Downloads

          - **Windows**: [GPU-Inspector-Setup-${VERSION}.exe](${BASE}/GPU-Inspector-Setup-${VERSION}.exe)
          - **Linux (Debian/Ubuntu)**: [gpu-inspector_${VERSION}_amd64.deb](${BASE}/gpu-inspector_${VERSION}_amd64.deb)
          - **macOS (Apple Silicon)**: [GPU-Inspector-${VERSION}-arm64.dmg](${BASE}/GPU-Inspector-${VERSION}-arm64.dmg)
          - **macOS (Intel)**: [GPU-Inspector-${VERSION}-x64.dmg](${BASE}/GPU-Inspector-${VERSION}-x64.dmg)

          The macOS build is the user interface only: it inspects Android devices over adb and
          opens \`.gpucap\` files, but cannot capture an application running on the Mac itself —
          there is no Apple build of the Vulkan layer.

          Installed builds update themselves: the app checks this repository's releases on startup.
          NOTES
          # latest.yml / latest-linux.yml and the .blockmap are what installed builds read to update.
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --latest \
            --title "GPU Inspector ${VERSION}" --notes-file notes.md assets/*
